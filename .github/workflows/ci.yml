name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  self-audit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Run auditgen against this repository
        # This step produces a report, it does not gate the build. `auditgen
        # audit` exits 1 when it finds gaps, which for this repository is the
        # expected state and the reason the report exists. Only the `verify`
        # job above is a required status check.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/cli.js audit "${{ github.repository }}" --framework soc2,iso27001 --no-ai --format markdown --out auditgen-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: auditgen-report
          path: auditgen-report.md
          if-no-files-found: ignore