# Depends on a `push` event in the same repository.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish from
        required: true

permissions:
  contents: read

jobs:
  # A release must never ship if verification does not pass on the same commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, never tags: this repository's Actions
      # policy sets sha_pinning_required, and a tag reference fails at
      # workflow startup before a single step runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Creating a GitHub release needs write access to the repository
      # contents. The npm publish uses its own OIDC token, not this one.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Check the working tree is clean after build
        run: git diff --exit-code

      # Proves the published artifact contains dist/, schema/ and the docs, and
      # nothing else. A release that silently omits dist/ is the classic npm
      # footgun, so this is checked on every publish rather than trusted.
      - name: Verify the package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish a GitHub release
        # `gh` ships with the runner, so this needs no third-party action.
        # The repository's Actions policy allows GitHub-owned actions only,
        # and softprops/action-gh-release is not one of them, so it could
        # never start here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Verify the evidence chain

          Every report auditgen produces is a tamper-evident SHA-256 chain.
          To check a report has not been edited after generation:

          ```
          npx auditgen verify your-report.json
          ```

          ## Compare against your last audit

          ```
          npx auditgen diff previous-report.json current-report.json
          ```

          This exits 1 on a regression, so it works as a CI gate.
          EOF
          gh release create "$TAG" \
            --generate-notes \
            --title "$TAG" \
            --notes-file release-notes.md
